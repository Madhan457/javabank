# Server Port
server.port=8080

# Application Name
spring.application.name=bank-management

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bank_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ashwi@2608
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Authenticated browser sessions for the separate frontend origin
server.servlet.session.cookie.name=TRUSTBANKSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional one-time bootstrap for the first officer (supply through environment)
bank.officer.bootstrap.username=admin
bank.officer.bootstrap.password=admin@123

# Jackson DateTime Serialization
spring.jackson.serialization.write-dates-as-timestamps=false