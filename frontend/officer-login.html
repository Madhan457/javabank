<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Bank | Officer Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <main class="auth-container officer-auth">
        <div class="auth-brand">
            <a href="index.html" class="brand-logo auth-home-link">Trust <span class="brand-highlight">Bank</span></a>
            <p>Officer access</p>
            <a href="index.html" class="auth-back-link">Back to Home</a>
        </div>
        <section class="auth-card auth-form-wrapper">
            <div class="form-header"><h1>Officer Login</h1><p>Sign in with your authorized officer username.</p></div>
            <form id="officer-login-form" onsubmit="handleOfficerLogin(event)" class="form-stack">
                <div class="form-group"><label for="officer-username">Username <span class="required">*</span></label><input id="officer-username" autocomplete="username" required></div>
                <div class="form-group"><label for="officer-password">Password <span class="required">*</span></label><div class="input-password-wrapper"><input type="password" id="officer-password" autocomplete="current-password" required><button type="button" class="btn-toggle-pass" aria-label="Show password" onclick="togglePasswordVisibility('officer-password')">Show</button></div></div>
                <button type="submit" class="btn btn-primary btn-block" id="btn-officer-login">Officer Login</button>
            </form>
        </section>
        <p class="auth-footer">Officer accounts are provisioned through backend configuration.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
